# CONTEXTE ÉTUDIANT : S3-S6 | Nginx dans Compose ou Kubernetes
# À PRÉPARER / ADAPTER : Conserver api:8000 et les préfixes du contrat ; utiliser dev.conf seulement en S1-S2.
# CONTRÔLE ATTENDU : Tester /, /api/version et une requête métier depuis le point d’entrée web.
#
# S3-S6 : configuration embarquée dans l’image web.
# Les noms api/db ne sont résolus que sur le réseau interne approprié.
# Nginx résout le nom api au démarrage et conserve l’adresse obtenue. Sous Compose,
# recréer seulement l’API peut changer son IP : redémarrer aussi web si un 502
# apparaît. Sous Kubernetes, l’adresse du Service api reste stable.
server {
    # Port non privilégié, cohérent avec Dockerfile, Compose et Service web.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Dépôts CSV : Nginx accepte jusqu'à 2 Mo pour laisser l'API refuser elle-même
    # au-delà de 1 Mio avec un 413 JSON lisible, plutôt qu'une page d'erreur Nginx.
    client_max_body_size 2m;
    # Un chemin statique absent reste une 404 ; pas de faux index.html en réponse.
    location / { try_files $uri $uri/ =404; }
    # Même origine côté navigateur : le client appelle /api/datasets, pas api:8000.
    location /api/ {
        # Sans slash de chemin final : conserver /api/ dans la requête transmise.
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Délai de connexion à l’API, distinct du délai de lecture de sa réponse.
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    # Exposer les probes par le même point d’entrée pour la recette.
    # Une erreur 502 du proxy est différente d’un 503 renvoyé par FastAPI.
    location /health/ {
        proxy_pass http://api:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
