# CONTEXTE ÉTUDIANT : S1-S2 | proxy Nginx conteneurisé, API sur le poste
# À PRÉPARER / ADAPTER : Lancer Uvicorn sur 0.0.0.0:8000 avant la recette navigateur.
# CONTRÔLE ATTENDU : Ouvrir le port 8080 et vérifier une requête transmise à l’API locale.
#
# S1-S2 : configuration montée en lecture seule par compose.dev.yaml.
# Ne pas utiliser ce nom d’hôte du poste pour le déploiement Kubernetes.
server {
    listen 8080;
    # Même limite qu'en production pour tester les dépôts CSV dès S2.
    client_max_body_size 2m;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    # Le proxy est en conteneur, mais Uvicorn tourne sur le poste en S1-S2.
    # extra_hosts dans compose.dev.yaml fournit ce nom sous Linux.
    location /api/ { proxy_pass http://host.docker.internal:8000; }
    location /health/ { proxy_pass http://host.docker.internal:8000; }
}
